<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonoMuse - Explore</title>
    <link rel="stylesheet" href="../static/styles.css" />
 <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
<script src="../static/script.js" defer></script>  
</head>
  <body>
    <div class="container">
      <header class="header">
        <h1>MonoMuse</h1>
      </header>
      <nav class="nav_bar">
        <a href="../index.html">Home</a>
        <a href="./explore.html">Explore</a>
        <a href="./exhibitions.html">Exhibitions</a>
        <a id="selected" href="./tickets.html">Buy Tickets</a>
        <a href="./checkout.html">Checkout</a>
      </nav>
      <main class="checkout_main">
        <h1>Tickets</h1>
        <table>
          <tr>
            <th>Ticket Type</th>
            <th>Description</th>
            <th>Price</th>
          </tr>
          <tr>
            <td>Adult</td>
            <td>Full-price ticket for adults.</td>
            <td>$20.00</td>
          </tr>
          <tr>
            <td>Child</td>
            <td>Reduced-price ticket for children.</td>
            <td>$10.00</td>
          </tr>
        </table>
        <button id="selectTickets">Choose Tickets</button>
        <div id="checkoutForm">
            <form onsubmit="purchase()">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" value="1" min="1" max="100"><br>
            <button type="submit">Buy Now</button>
            </form>
        </div>
      </main>
      <footer class="footer">
          <p id="copyYear">&copy; MonoMuse. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
